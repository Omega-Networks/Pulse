# swift-openapi-generator 1.13.0 config for Pulse's NetBox client.
# Filter by concrete paths (exact match — the CLI does not glob). Never by tags:
# this instance (NetBox 4.6.2) has 14 real tags, and even if they collapsed the
# path filter is the tighter contract.
#
# Operations, not paths: a path filter is a union of every verb on that
# item, which pulls in bulk update/destroy we will never call. Multiple
# filter keys are also a union, so this list is operations-only.
# P1 calls *_list / *_retrieve / status_retrieve only. Write verbs are
# omitted: generated PatchedWritable*Request types from this 4.6.2
# schema do not conform to Encodable (empty oneOf). P4 regenerates them
# once that is solved.
generate:
  - types
  - client
accessModifier: public
namingStrategy: defensive
additionalFileComments:
  - "swift-format-ignore-file"
filter:
  operations:
    - dcim_device_roles_list
    - dcim_device_roles_retrieve
    - dcim_device_types_list
    - dcim_device_types_retrieve
    - tenancy_tenant_groups_list
    - tenancy_tenant_groups_retrieve
    - tenancy_tenants_list
    - tenancy_tenants_retrieve
    - dcim_regions_list
    - dcim_regions_retrieve
    - dcim_site_groups_list
    - dcim_site_groups_retrieve
    - dcim_sites_list
    - dcim_sites_retrieve
    - dcim_racks_list
    - dcim_racks_retrieve
    - dcim_devices_list
    - dcim_devices_retrieve
    - dcim_device_bays_list
    - dcim_device_bays_retrieve
    - dcim_interfaces_list
    - dcim_interfaces_retrieve
    - dcim_cables_list
    - dcim_cables_retrieve
    - ipam_services_list
    - ipam_services_retrieve
    - core_object_changes_list
    - core_object_changes_retrieve
    - status_retrieve
